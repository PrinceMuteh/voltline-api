services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: voltline
      POSTGRES_PASSWORD: voltline
      POSTGRES_DB: voltline
    ports:
      - '5435:5432'
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U voltline']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6380:6379'
    volumes:
      - redis-data:/data

volumes:
  postgres-data:
  redis-data:
